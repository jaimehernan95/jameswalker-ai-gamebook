services:
  - type: web
    name: jameswalker-ai-gamebook
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
